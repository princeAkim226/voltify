name: Build et publication

# Deux modes :
#   - déclenchement manuel : build de vérification, l'APK part en artefact.
#   - tag `vX.Y.Z` : publication complète — release GitHub, manifeste, mise en
#     ligne du site de téléchargement.
# Un push sur master ne construit rien : les minutes de build se dépensent
# quand on publie, pas à chaque commit.
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Sauter analyze et tests (build de dépannage)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# Nécessaire pour créer la release et committer le manifeste.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          # Épinglé sur la version utilisée en local : un APK ne doit pas
          # changer de comportement parce que le runner a bougé.
          flutter-version: 3.29.2
          channel: stable
          cache: true

      # Un tag qui ne correspond pas à pubspec.yaml produirait un manifeste
      # pointant vers une release inexistante : l'app téléchargerait une 404.
      - name: Vérifier que le tag correspond à pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Tag $GITHUB_REF_NAME mais pubspec.yaml annonce $PUBSPEC."
            echo "Corrigez pubspec.yaml, ou posez le tag v$PUBSPEC."
            exit 1
          fi
          echo "Tag et pubspec concordent sur $PUBSPEC."

      - name: Restaurer le keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64 et ANDROID_KEY_PROPERTIES requis."
            echo "Sans eux le build serait signé avec la clé de debug, et l'APK"
            echo "ne pourrait pas s'installer par-dessus la version publiée."
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/voltify-release.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          echo "Keystore restauré ($(stat -c%s android/keystore/voltify-release.jks) octets)."

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Analyser
        if: ${{ !inputs.skip_tests }}
        run: flutter analyze

      - name: Tester
        if: ${{ !inputs.skip_tests }}
        run: flutter test

      - name: Construire l'APK release
        run: flutter build apk --release

      - name: Vérifier que l'APK est signé avec la clé de release
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          # Un APK signé en debug s'installerait sur un téléphone neuf mais
          # refuserait la mise à jour par-dessus la version publiée.
          if "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | grep -qi "CN=Android Debug"; then
            echo "::error::APK signé avec la clé de debug — keystore non pris en compte."
            exit 1
          fi
          echo "Signature de release confirmée."

      - name: Résumé
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIZE=$(stat -c%s "$APK")
          {
            echo "### APK construit"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$(grep '^version:' pubspec.yaml | cut -d' ' -f2)\` |"
            echo "| Taille | $((SIZE / 1024 / 1024)) Mo ($SIZE octets) |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'APK en artefact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: voltify-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # --- À partir d'ici, uniquement sur tag : la publication réelle. ---

      - name: Générer le manifeste
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk web_download/voltify.apk
          node scripts/make_version_json.mjs
          cat web_download/version.json

      # La release doit exister avant que le manifeste ne l'annonce : celui-ci
      # désigne l'APK par une URL taguée.
      - name: Publier la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('web_download/version.json','utf8'));
            console.log(m.notes.map(n => '- ' + n).join('\n'));
            console.log('');
            console.log('Android · ' + (m.size/1048576).toFixed(1) + ' Mo · build ' + m.build);
          " > /tmp/notes.md
          # Le fichier doit s'appeler voltify.apk : c'est ce nom que le
          # manifeste met dans son URL. `chemin#libelle` ne renomme pas le
          # fichier, il ne change que l'affichage — d'où une 404 en 1.4.0.
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/voltify.apk
          gh release create "$GITHUB_REF_NAME" /tmp/voltify.apk \
            --title "Voltify ${GITHUB_REF_NAME#v}" \
            --notes-file /tmp/notes.md

      # Annoncer une version dont l'APK est introuvable ferait télécharger une
      # page d'erreur aux apps installées. On vérifie avant de publier le
      # manifeste, pas après : tant qu'il n'est pas en ligne, personne ne voit
      # la nouvelle version.
      - name: Vérifier que l'APK annoncé est réellement téléchargeable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          URL=$(node -p "JSON.parse(require('fs').readFileSync('web_download/version.json','utf8')).url")
          ANNONCEE=$(node -p "JSON.parse(require('fs').readFileSync('web_download/version.json','utf8')).size")
          REELLE=$(curl -sIL "$URL" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
          if [ "$REELLE" != "$ANNONCEE" ]; then
            echo "::error::Le manifeste annonce $ANNONCEE octets, l'URL en sert $REELLE."
            echo "URL : $URL"
            exit 1
          fi
          echo "Manifeste et APK publié concordent ($ANNONCEE octets)."

      # Le site de téléchargement se déploie depuis master : le manifeste doit
      # y être committé, sinon dl.raaga-bf.com sert encore l'ancienne version.
      - name: Committer le manifeste sur master
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp web_download/version.json /tmp/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master
          cp /tmp/version.json web_download/version.json
          git add web_download/version.json
          if git diff --cached --quiet; then
            echo "Manifeste déjà à jour, rien à committer."
          else
            git commit -m "Announce version ${GITHUB_REF_NAME#v} to installed apps."
            git push origin master
          fi

      - name: Mettre en ligne le site de téléchargement
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::Secret COOLIFY_TOKEN manquant : le manifeste est committé"
            echo "mais dl.raaga-bf.com sert encore l'ancienne version."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "https://panel.raaga-bf.com/api/v1/deploy?uuid=5kkll6euuei9y7w3xi5pmwhw"
          echo ""
          echo "Déploiement de dl.raaga-bf.com demandé."

      - name: Récapitulatif de publication
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo ""
            echo "### Publié"
            echo ""
            echo "- Release : ${{ github.server_url }}/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
            echo "- Manifeste : https://dl.raaga-bf.com/version.json"
            echo "- Page : https://dl.raaga-bf.com"
          } >> "$GITHUB_STEP_SUMMARY"
